# Default values for bufstream-operator chart
# This file contains values passed to the Bufstream subchart

bufstream:
  # Single replica for local development
  bufstream:
    deployment:
      replicaCount: 1
  
  # Use in-memory storage for local development
  storage:
    use: memory
  
  metadata:
    use: memory
  
  # Observability settings
  observability:
    metrics:
      exporter: "PROMETHEUS"
  
  # Configure advertised listeners for local development
  # This allows the controller to connect via localhost port-forward
  kafka:
    advertisedListeners:
      - name: PLAINTEXT
        port: 9092
        # Use cluster DNS for in-cluster access
        host: "bufstream.bufstream.svc.cluster.local"

    # SASL SCRAM authentication
    authentication:
      sasl:
        scram:
          adminCredentials:
            hash: sha512
            plaintext:
              secret: bufstream-admin-credentials

    # ACL authorization
    authorization:
      superUsers:
        - admin
      allowEveryoneIfNoAclFound: true

# AKHQ - Kafka UI for Bufstream
akhq:
  enabled: true
  
  service:
    type: NodePort
    nodePort: 30080
  
  configuration:
    akhq:
      connections:
        bufstream:
          properties:
            client.id: "akhq;broker_count=1"
            bootstrap.servers: "bufstream.bufstream.svc.cluster.local:9092"
            metadata.recovery.strategy: REBOOTSTRAP
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"admin\" password=\"adminpassword123\";"

