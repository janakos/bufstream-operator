apiVersion: bufstream.buf.build/v1alpha1
kind: BufstreamTopic
metadata:
  name: test-topic
  namespace: bufstream
spec:
  # Topic will be named "test-topic" (defaults to metadata.name)
  partitions: 3
  replicationFactor: 1
  bootstrapServers: "localhost:9092"
  assumeOwnership: true  # Assume ownership of existing topic
  config:
    retention.ms: "86400000"  # 1 day
    compression.type: "gzip"

