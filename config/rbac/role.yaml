---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - bufstream.buf.build
  resources:
  - bufstreamclusters
  - bufstreamtopics
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bufstream.buf.build
  resources:
  - bufstreamclusters/finalizers
  - bufstreamtopics/finalizers
  verbs:
  - update
- apiGroups:
  - bufstream.buf.build
  resources:
  - bufstreamclusters/status
  - bufstreamtopics/status
  verbs:
  - get
  - patch
  - update
